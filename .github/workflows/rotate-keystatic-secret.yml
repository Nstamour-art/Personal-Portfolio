name: Rotate KEYSTATIC_SECRET

# Quarterly rotation of the Keystatic session-signing secret on Vercel.
#
# Why:
#   - KEYSTATIC_SECRET signs admin session cookies. Rotating it on a regular
#     cadence invalidates any sessions that may have been silently leaked.
#   - Doing it by hand requires remembering. This workflow does the part a
#     machine can do (generate + push to Vercel + redeploy) and opens an
#     issue for the parts a human still has to do (GitHub App secret, user
#     audit, commit review).
#
# Cadence:
#   - 09:00 UTC on the 1st of January, April, July, October.
#     ≈ every 90 days. Time of day is "before North-America business hours"
#     so the redeploy is done before you'd notice.
#   - GitHub Actions may delay scheduled runs by a few hours under load;
#     for a 90-day cadence that's irrelevant.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN           — Vercel API token (Account Settings → Tokens).
#                            Scope to the team that owns the project if you
#                            can; otherwise it's account-wide.
#   VERCEL_PROJECT_ID      — Project Settings → General → Project ID.
#   VERCEL_TEAM_ID         — Only if the project lives in a Vercel Team.
#                            Leave unset for personal accounts.
#   VERCEL_DEPLOY_HOOK_URL — Project Settings → Git → Deploy Hooks.
#                            Create one for the `main` branch, paste URL.
#
# Manual trigger:
#   Actions tab → "Rotate KEYSTATIC_SECRET" → Run workflow. Useful for
#   testing the wiring on day one or for an emergency rotation.

on:
  schedule:
    - cron: '0 9 1 */3 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rotate:
    name: Generate + push + redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate new secret
        id: gen
        run: |
          NEW_SECRET="$(openssl rand -base64 32 | tr -d '\n')"
          # Mask in all subsequent logs so an accidental `echo` can't leak it.
          echo "::add-mask::$NEW_SECRET"
          echo "value=$NEW_SECRET" >> "$GITHUB_OUTPUT"

      - name: Find KEYSTATIC_SECRET env var on Vercel
        id: find
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          QS=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then QS="?teamId=$VERCEL_TEAM_ID"; fi

          RESP="$(curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env$QS")"

          ID="$(echo "$RESP" | jq -r \
            '.envs[] | select(.key=="KEYSTATIC_SECRET" and (.target | index("production"))) | .id' \
            | head -n1)"

          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::No production KEYSTATIC_SECRET env var found on Vercel project $VERCEL_PROJECT_ID. Set it once in the Vercel dashboard, then re-run."
            exit 1
          fi

          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Patch env var with new value
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          ENV_ID: ${{ steps.find.outputs.id }}
          NEW_SECRET: ${{ steps.gen.outputs.value }}
        run: |
          set -euo pipefail
          QS=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then QS="?teamId=$VERCEL_TEAM_ID"; fi

          # Build the JSON body with jq so the secret is correctly escaped
          # even if openssl ever returns characters that need it.
          BODY="$(jq -nc --arg v "$NEW_SECRET" '{value:$v}')"

          curl -fsS -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$ENV_ID$QS" \
            > /dev/null

          echo "✓ KEYSTATIC_SECRET updated on Vercel"

      - name: Trigger production redeploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set. Create a hook in Vercel → Project → Settings → Git → Deploy Hooks (branch: main)."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "✓ Production redeploy queued — new secret active in a few minutes"

      - name: Open quarterly hygiene checklist issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          QUARTER="$(date -u +'%Y-Q%q' 2>/dev/null || \
            printf '%s-Q%d' "$(date -u +%Y)" "$(( ( $(date -u +%-m) - 1 ) / 3 + 1 ))")"

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Admin hardening checklist — $QUARTER" \
            --label "security" \
            --body "$(cat <<EOF
          Auto-rotation ran on **$DATE**. The bot handled the easy part; the rest is manual (~10 minutes).

          ## Done automatically
          - [x] \`KEYSTATIC_SECRET\` rotated on Vercel
          - [x] Production redeploy triggered (existing /keystatic sessions invalidated)

          ## Your turn
          - [ ] **Rotate the Keystatic GitHub App client secret**
                <https://github.com/settings/apps> → your app → **Generate a new client secret** → copy → on Vercel update \`KEYSTATIC_GITHUB_CLIENT_SECRET\` → Deployments → Redeploy.
          - [ ] **Audit authorized users** on the Keystatic GitHub App. Remove anyone who no longer needs admin access.
          - [ ] **Skim recent commits on \`main\`**: \`git log --since="3 months ago" --pretty=fuller\`. Anything you didn't make is a signal to investigate.
          - [ ] **Close this issue** when done.

          Next auto-rotation: ~3 months from today. Trigger early via Actions → "Rotate KEYSTATIC_SECRET" → Run workflow if you ever suspect a leak.
          EOF
          )" || echo "::warning::Could not open issue (label missing or permission issue). Rotation itself succeeded."

      - name: Job summary
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          {
            echo "### KEYSTATIC_SECRET rotated"
            echo ""
            echo "- Vercel project: \`$VERCEL_PROJECT_ID\`"
            echo "- Redeploy: triggered via deploy hook"
            echo "- Sessions: existing /keystatic sessions invalidated; sign in with GitHub to resume."
            echo "- Manual follow-ups: see the issue this workflow just opened."
          } >> "$GITHUB_STEP_SUMMARY"
